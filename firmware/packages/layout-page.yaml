# ---------------------------------------------------------------------------
# Страница, которую рисует интерпретатор panel_ui.
#
# В YAML она пустая: это только контейнер. Всё содержимое строится
# в рантайме из layout.json — в этом вся суть, см. ADR-0001.
# ---------------------------------------------------------------------------

lvgl:
  pages:
    - id: page_layout
      widgets:
        - obj:
            id: statusbar
            x: 0
            y: 0
            width: 720
            height: 44
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x141A20
            scrollable: false
            widgets:
              - label:
                  id: sb_clock
                  text: "--:--"
                  align: LEFT_MID
                  x: 16
                  text_font: f_body
                  text_color: 0xE3E9EE
              - label:
                  id: sb_date
                  text: ""
                  align: LEFT_MID
                  x: 92
                  text_font: f_small
                  text_color: 0x6B7B88
              - label:
                  id: sb_wifi
                  text: "\U0000F1EB"
                  align: RIGHT_MID
                  x: -150
                  text_font: montserrat_20
                  text_color: 0x6B7B88
              - image:
                  id: sb_ha
                  src: img_ha_logo
                  align: RIGHT_MID
                  x: -98
              - button:
                  id: sb_settings
                  align: RIGHT_MID
                  x: -8
                  width: 64
                  height: 36
                  bg_color: 0x222B33
                  widgets:
                    - label:
                        text: "\U0000F013"
                        align: CENTER
                        text_font: montserrat_20
                  on_click:
                    # Оформление применяем при каждом входе: блок theme:
                    # не покрывает страницы, а на загрузке что-то может
                    # не успеть создаться.
                    - script.execute: style_extras
                    - lvgl.page.show: page_settings
        # Ловец пробуждающего касания. Объявлен здесь, но при загрузке
        # переносится на верхний слой LVGL, чтобы работать на всех страницах.
        - obj:
            id: wake_catcher
            x: 0
            y: 0
            width: 720
            height: 720
            hidden: true
            on_click:
              # Ничего не делаем намеренно: смысл в том, чтобы касание
              # НЕ дошло до элемента под ловцом. Само касание уже сбросило
              # счётчик простоя LVGL, и подсветка вернётся сама.
              - logger.log: "пробуждающее касание перехвачено"

        - obj:
            id: ui_root
            x: 0
            y: 44
            width: 720
            height: 676
            # Тёмный фон задаётся и здесь, а не только из кода: пустой
            # контейнер (интерпретатор ещё не отработал) иначе светится
            # белым и выглядит как поломка.
            bg_color: 0x0B0F13
            bg_opa: COVER
            scrollable: false
            pad_all: 0
            border_width: 0
            radius: 0

button:
  - platform: template
    name: "Построить интерфейс из раскладки"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(panel_storage)->set_root(id(ui_root));'
      - lambda: 'id(panel_storage)->rebuild();'
      - lvgl.page.show: page_layout

  - platform: template
    name: "Демо-режим: заполнить карточки"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(panel_storage)->demo_fill();'
      - lvgl.page.show: page_layout

  - platform: template
    name: "Записать пример раскладки"
    entity_category: diagnostic
    on_press:
      # Реальные сущности из вашего HA: гостиная.
      - lambda: |-
          std::string sample = "{\"schema\": \"panel86/1\", \"room\": \"gostinaia\", \"revision\": 3, \"theme\": {\"accent\": \"#C2610C\", \"radius\": 20}, \"defaults\": {\"throttle\": \"1s\", \"deadband\": 0.5}, \"pages\": [{\"id\": \"home\", \"title\": \"Гостиная\", \"grid\": [2, 3], \"cards\": [{\"type\": \"light\", \"entity\": \"light.esp8266sw1_relay_1\", \"label\": \"Люстра\"}, {\"type\": \"light\", \"entity\": \"light.esp8266sw1_relay_2\", \"label\": \"Бра\"}, {\"type\": \"climate\", \"entity\": \"climate.iug_lugovaia_12_gostinaia_2\", \"label\": \"Отопление\", \"unit\": \"°C\"}, {\"type\": \"sensor\", \"entity\": \"sensor.iug_lugovaia_12_gostinaia_2\", \"label\": \"Температура\", \"unit\": \"°C\", \"decimals\": 1}, {\"type\": \"switch\", \"entity\": \"switch.esp32ac2_esp32ac2_dry\", \"label\": \"Осушение\"}, {\"type\": \"sensor\", \"entity\": \"sensor.kca16homemcu1_smoke_ch1_status\", \"label\": \"Дым\", \"decimals\": 0}]}, {\"id\": \"ogorod\", \"title\": \"Огород\", \"grid\": [2, 2], \"cards\": [{\"type\": \"switch\", \"entity\": \"switch.kca6watertower_pumpmotor\", \"label\": \"Насос\"}, {\"type\": \"valve\", \"entity\": \"valve.kca6frontyard_splinkler\", \"label\": \"Газон\"}, {\"type\": \"sensor\", \"entity\": \"sensor.kca6watertower_tanklevel\", \"label\": \"Уровень бака\", \"unit\": \"%\", \"decimals\": 0, \"warn_below\": 15}, {\"type\": \"sensor\", \"entity\": \"sensor.kca6watertower_pzem_voltage\", \"label\": \"Напряжение\", \"unit\": \"В\", \"decimals\": 0, \"deadband\": 1.0, \"throttle\": \"2s\", \"warn_below\": 200}]}, {\"id\": \"bania\", \"title\": \"Баня\", \"grid\": [2, 2], \"cards\": [{\"type\": \"light\", \"entity\": \"light.bania\", \"label\": \"Свет\"}, {\"type\": \"light\", \"entity\": \"light.kca6banya_backlight_banya\", \"label\": \"Подсветка\"}, {\"type\": \"switch\", \"entity\": \"switch.kca6banya_heatingwaterwire\", \"label\": \"Нагрев воды\"}, {\"type\": \"sensor\", \"entity\": \"sensor.kca6frontyard_currentload\", \"label\": \"Нагрузка\", \"unit\": \"Вт\", \"decimals\": 0}]}], \"screensaver\": {\"after\": \"60s\", \"type\": \"clock\", \"brightness\": 12, \"wake\": [\"touch\"]}}";
          id(panel_storage)->write_layout(sample);
