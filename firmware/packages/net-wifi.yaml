# ---------------------------------------------------------------------------
# Профиль сети: Wi-Fi 6 через ESP32-C6 по SDIO (esp-hosted).
# Держим как резерв. Известная проблема: esphome/esphome#10956 —
# потери пакетов SDIO, срывы ассоциации, иногда паника.
# Перед тем как ставить это основным каналом, прогнать сутки нагрузки.
# ---------------------------------------------------------------------------

esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  reboot_timeout: 10min
  ap:
    ssid: "panel86-setup"
    password: !secret wifi_fallback_pwd

captive_portal:

# Прошивка C6 обновляется по воздуху отдельно от основной.
update:
  - platform: esp32_hosted
    id: c6_firmware
    name: "Прошивка C6"
    entity_category: diagnostic
    type: http
    source: "https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json"
