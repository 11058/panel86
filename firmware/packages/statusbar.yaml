# ---------------------------------------------------------------------------
# Статусная строка поверх раскладки.
#
# Зачем: человек у стены должен видеть время и понимать, жива ли связь,
# ещё до того как что-то нажмёт. А шестерёнка — единственный вход
# в настройку Wi-Fi с самой панели, без телефона и ноутбука.
#
# Символы (шестерёнка, значок Wi-Fi) живут в приватной области Unicode
# и есть только во встроенном montserrat — в наших кириллических шрифтах
# их нет, будут квадратики. Поэтому символьным меткам явно задан montserrat.
# ---------------------------------------------------------------------------

# Время: сначала пробуем интернет, HA — как второй источник.
# Панель не должна показывать прочерки вместо часов только потому,
# что сервер недоступен.
# Логотип Home Assistant как маска: один файл, цвет задаётся перекраской
# в зависимости от состояния связи.
image:
  # --- Кадры с камер ---
  #
  # Пул из двух картинок: больше двух камер одновременно на экране 720x720
  # всё равно не разглядеть, а каждая занимает буфер под распакованный кадр.
  # Адрес подставляется на лету — /api/camera_proxy/<сущность> у Home
  # Assistant, — а токен берётся из того, что панель сохранила у себя.
  #
  # Декодирование JPEG программное, через JPEGDEC. Аппаратный блок P4
  # заманчивее, но ESPHome его не использует, а свой декодер ради этого
  # писать пока не стоит.
  - platform: online_image
    id: cam_img_0
    url: "http://127.0.0.1/none.jpg"
    type: RGB565
    format: JPEG
    resize: 340x200
    buffer_size: 32768
    update_interval: never
  - platform: online_image
    id: cam_img_1
    url: "http://127.0.0.1/none.jpg"
    type: RGB565
    format: JPEG
    resize: 340x200
    buffer_size: 32768
    update_interval: never

  - platform: file
    file: images/ha_logo.png
    id: img_ha_logo
    type: GRAYSCALE
    resize: 26x26

font:
# Иконки Material Design Icons.
#
# Из шрифта берём только 57 нужных глифов, а не все 7447: полный набор
# весил бы мегабайты флеша ради картинок, которых мы никогда не покажем.
  - file: fonts/mdi.ttf
    id: f_icon
    size: 34
    bpp: 4
    glyphs:
