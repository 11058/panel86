# ---------------------------------------------------------------------------
# Статусная строка поверх раскладки.
#
# Зачем: человек у стены должен видеть время и понимать, жива ли связь,
# ещё до того как что-то нажмёт. А шестерёнка — единственный вход
# в настройку Wi-Fi с самой панели, без телефона и ноутбука.
#
# Символы (шестерёнка, значок Wi-Fi) живут в приватной области Unicode
# и есть только во встроенном montserrat — в наших кириллических шрифтах
# их нет, будут квадратики. Поэтому символьным меткам явно задан montserrat.
# ---------------------------------------------------------------------------

# Время: сначала пробуем интернет, HA — как второй источник.
# Панель не должна показывать прочерки вместо часов только потому,
# что сервер недоступен.
# Логотип Home Assistant как маска: один файл, цвет задаётся перекраской
# в зависимости от состояния связи.
image:
  - file: images/ha_logo.png
    id: img_ha_logo
    type: GRAYSCALE
    resize: 26x26

time:
  - platform: sntp
    id: sntp_time
    timezone: UTC-5   # это GMT+5: в POSIX знак инвертирован
    servers:
      - pool.ntp.org
      - time.cloudflare.com

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Часы
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            char hm[8], dm[24];
            snprintf(hm, sizeof(hm), "%02d:%02d", t.hour, t.minute);
            static const char *const MON[] = {"янв","фев","мар","апр","мая","июн",
                                              "июл","авг","сен","окт","ноя","дек"};
            snprintf(dm, sizeof(dm), "%d %s", t.day_of_month, MON[(t.month - 1) % 12]);
            lv_label_set_text(id(sb_clock), hm);
            lv_label_set_text(id(sb_date), dm);
          }

          // Три состояния вместо двух. Промежуточное — оранжевое — там,
          // где связь формально есть, но пользоваться панелью ещё нельзя.
          // Это честнее бинарного «подключено», которое вводит в заблуждение.
          const uint32_t GREEN = 0x3FB950, ORANGE = 0xD9A441, RED = 0xC24038;

          // Wi-Fi: красный — сети нет; оранжевый — есть, но сигнал слабый
          // и связь будет рваться; зелёный — всё хорошо.
          uint32_t wc = RED;
          if (wifi::global_wifi_component->is_connected()) {
            const int8_t rssi = wifi::global_wifi_component->wifi_rssi();
            wc = (rssi < -75) ? ORANGE : GREEN;
          }
          lv_obj_set_style_text_color(id(sb_wifi), lv_color_hex(wc), LV_PART_MAIN);

          // Home Assistant:
          //   красный   — соединения нет вовсе;
          //   оранжевый — соединение есть, но состояния сущностей ещё
          //               не поступают: подписки доезжают только после
          //               переподключения (см. ADR-0002), и в этот момент
          //               карточки показывают устаревшие значения;
          //   зелёный   — связь полная, данные идут.
          uint32_t hc = RED;
          if (api::global_api_server->is_connected()) {
            hc = api::global_api_server->is_connected_with_state_subscription() ? GREEN : ORANGE;
          }
          lv_obj_set_style_image_recolor(id(sb_ha), lv_color_hex(hc), LV_PART_MAIN);
          lv_obj_set_style_image_recolor_opa(id(sb_ha), LV_OPA_COVER, LV_PART_MAIN);

  # Живое наполнение страниц настроек и засыпание экрана.
  - interval: 2s
    then:
      - lambda: |-
          // --- Состояние сети ---
          char buf[420];
          const bool w = wifi::global_wifi_component->is_connected();
          auto ips = wifi::global_wifi_component->wifi_sta_ip_addresses();
          char ipbuf[48] = "—";
          if (w && !ips.empty())
            ips[0].str_to(ipbuf);
          const char *ip = ipbuf;
          std::string ssid = w ? wifi::global_wifi_component->wifi_ssid() : std::string("—");
          snprintf(buf, sizeof(buf),
                   "Интерфейс:  %s\n"
                   "Адрес:      %s\n"
                   "Сеть:       %s\n"
                   "Сигнал:     %d dBm\n"
                   "MAC:        %s\n"
                   "\n"
                   "Ethernet:   кабель не подключён\n"
                   "Home Assistant: %s",
                   w ? "Wi-Fi" : "нет связи",
                   ip, ssid.c_str(),
                   w ? (int) wifi::global_wifi_component->wifi_rssi() : 0,
                   get_mac_address_pretty().c_str(),
                   api::global_api_server->is_connected()
                     ? (api::global_api_server->is_connected_with_state_subscription()
                          ? "подключён, данные идут" : "подключён, данные ещё не идут")
                     : "нет связи");
          lv_label_set_text(id(lbl_netinfo), buf);
          lv_label_set_text(id(lbl_net_wifi), w ? ssid.c_str() : "не подключено");
          lv_label_set_text(id(lbl_net_eth), "кабель не подключён");

          // --- О панели ---
          char ab[320];
          snprintf(ab, sizeof(ab),
                   "Прошивка:   %s\n"
                   "ESPHome:    " ESPHOME_VERSION "\n"
                   "Работает:   %u мин\n"
                   "Куча:       %u КиБ\n"
                   "PSRAM:      %u КиБ\n"
                   "Раскладка:  %u карточек",
                   App.get_name().c_str(),
                   (unsigned) (millis() / 60000),
                   (unsigned) (esp_get_free_heap_size() / 1024),
                   (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                   (unsigned) id(panel_storage)->card_count());
          lv_label_set_text(id(lbl_about), ab);

          // --- Текущее время на странице «Время» ---
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            char tb[48];
            snprintf(tb, sizeof(tb), "%02d:%02d:%02d, %02d.%02d.%04d",
                     t.hour, t.minute, t.second, t.day_of_month, t.month, t.year);
            lv_label_set_text(id(lbl_time_now), tb);
          } else {
            lv_label_set_text(id(lbl_time_now), "время не синхронизировано");
          }
          lv_label_set_text(id(lbl_time_src),
                            id(panel_storage)->time_source() == "sntp" ? "интернет" : "Home Assistant");

  # Засыпание экрана с расписанием.
  #
  # Днём панель может гореть постоянно — на кухне или в прихожей это
  # удобнее, чем каждый раз будить её касанием. Ночью, наоборот, экран
  # гасится полностью: подсветка в спальне ночью недопустима даже слабая.
  #
  # Первое касание после погасания только будит и НИЧЕГО не нажимает:
  # иначе спросонья случайно выключаешь свет, которого не собирался трогать.
  - interval: 1s
    then:
      - lambda: |-
          auto *ps = id(panel_storage);
          const uint32_t after = ps->sleep_after_ms();

          // Какой сейчас период. Без синхронизированного времени считаем днём:
          // лучше зря светить, чем оставить человека перед чёрным стеклом.
          bool night = false;
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            const int h = t.hour, d = ps->day_start_hour(), n = ps->night_start_hour();
            night = (d <= n) ? (h < d || h >= n)      // обычный день внутри суток
                             : (h < d && h >= n);     // «день» переходит через полночь
          }

          int target;
          if (!night && ps->day_always_on()) {
            target = ps->brightness();                       // днём горит всегда
          } else if (after == 0) {
            target = ps->brightness();                       // засыпание отключено
          } else if (lv_display_get_inactive_time(nullptr) > after) {
            target = (night && ps->night_off()) ? 0 : ps->sleep_brightness();
          } else {
            target = ps->brightness();
          }

          static int applied = -1;
          if (target == applied) return;
          const bool waking = (applied >= 0 && target > applied);
          applied = target;

          auto call = id(backlight).turn_on();
          call.set_brightness(target / 100.0f);
          call.set_transition_length(waking ? 200 : 1200);
          call.perform();

          // Ловец касания: пока экран приглушён или погашен, поверх всего
          // висит прозрачный слой. Он съедает первое касание, будит панель
          // и уходит — нажатие не доходит до карточки под ним.
          lv_obj_t *c = id(wake_catcher);
          if (target < ps->brightness()) {
            lv_obj_remove_flag(c, LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(c);
          } else {
            lv_obj_add_flag(c, LV_OBJ_FLAG_HIDDEN);
          }

  # Досинхронизация времени.
  #
  # ESPHome поднимает SNTP в setup(), то есть ДО появления сети: первая
  # попытка уходит в пустоту, а следующая — только через интервал
  # синхронизации, то есть через часы. Поэтому пока время не получено,
  # перезапускаем SNTP каждые 20 с при живой сети.
  - interval: 20s
    then:
      - lambda: |-
          if (id(sntp_time).now().is_valid()) return;
          if (!wifi::global_wifi_component->is_connected()) return;
          // Частая причина — не работает разрешение имён: сервер задан
          // именем, а DNS в сети не выдан или недоступен.
          auto dns = wifi::global_wifi_component->get_dns_address(0);
          char dbuf[48] = "нет";
          dns.str_to(dbuf);

          // Если сервер имён не выдан, имя NTP-сервера разрешать нечем
          // и время не придёт никогда. Наблюдалось на живой панели:
          // DNS 0.0.0.0 при исправно полученном адресе. Похоже, виноват
          // Ethernet — он настроен, кабеля нет, и его бесконечные попытки
          // DHCP затирают общие настройки.
          if (strcmp(dbuf, "0.0.0.0") == 0) {
            ip_addr_t fallback;
            IP_ADDR4(&fallback, 1, 1, 1, 1);
            dns_setserver(0, &fallback);
            IP_ADDR4(&fallback, 8, 8, 8, 8);
            dns_setserver(1, &fallback);
            ESP_LOGW("time", "DNS не выдан — ставлю резервный 1.1.1.1");
          }

          ESP_LOGI("time", "времени нет — перезапускаю SNTP (DNS: %s)", dbuf);
          id(sntp_time).call_setup();
          id(sntp_time).update();
