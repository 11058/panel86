time:
  - platform: sntp
    id: sntp_time
    timezone: UTC-5   # это GMT+5: в POSIX знак инвертирован
    servers:
      - pool.ntp.org
      - time.cloudflare.com

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Часы
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            char hm[8], dm[24];
            snprintf(hm, sizeof(hm), "%02d:%02d", t.hour, t.minute);
            static const char *const MON[] = {"янв","фев","мар","апр","мая","июн",
                                              "июл","авг","сен","окт","ноя","дек"};
            snprintf(dm, sizeof(dm), "%d %s", t.day_of_month, MON[(t.month - 1) % 12]);
            lv_label_set_text(id(sb_clock), hm);
            lv_label_set_text(id(sb_date), dm);
          }

          // Три состояния вместо двух. Промежуточное — оранжевое — там,
          // где связь формально есть, но пользоваться панелью ещё нельзя.
          // Это честнее бинарного «подключено», которое вводит в заблуждение.
          const uint32_t GREEN = 0x3FB950, ORANGE = 0xD9A441, RED = 0xC24038;

          // Wi-Fi: красный — сети нет; оранжевый — есть, но сигнал слабый
          // и связь будет рваться; зелёный — всё хорошо.
          uint32_t wc = RED;
          if (wifi::global_wifi_component->is_connected()) {
            const int8_t rssi = wifi::global_wifi_component->wifi_rssi();
            wc = (rssi < -75) ? ORANGE : GREEN;
          }
          lv_obj_set_style_text_color(id(sb_wifi), lv_color_hex(wc), LV_PART_MAIN);

          // Home Assistant:
          //   красный   — соединения нет вовсе;
          //   оранжевый — соединение есть, но состояния сущностей ещё
          //               не поступают: подписки доезжают только после
          //               переподключения (см. ADR-0002), и в этот момент
          //               карточки показывают устаревшие значения;
          //   зелёный   — связь полная, данные идут.
          uint32_t hc = RED;
          if (api::global_api_server->is_connected()) {
            hc = api::global_api_server->is_connected_with_state_subscription() ? GREEN : ORANGE;
          }
          lv_obj_set_style_image_recolor(id(sb_ha), lv_color_hex(hc), LV_PART_MAIN);
          lv_obj_set_style_image_recolor_opa(id(sb_ha), LV_OPA_COVER, LV_PART_MAIN);

  # Живое наполнение страниц настроек и засыпание экрана.
  - interval: 2s
    then:
      - lambda: |-
          // --- Состояние сети ---
          char buf[420];
          const bool w = wifi::global_wifi_component->is_connected();
          auto ips = wifi::global_wifi_component->wifi_sta_ip_addresses();
          char ipbuf[48] = "—";
          if (w && !ips.empty())
            ips[0].str_to(ipbuf);
          const char *ip = ipbuf;
          std::string ssid = w ? wifi::global_wifi_component->wifi_ssid() : std::string("—");
          snprintf(buf, sizeof(buf),
                   "Интерфейс:  %s\n"
                   "Адрес:      %s\n"
                   "Сеть:       %s\n"
                   "Сигнал:     %d dBm\n"
                   "MAC:        %s\n"
                   "\n"
                   "Ethernet:   кабель не подключён\n"
                   "Home Assistant: %s",
                   w ? "Wi-Fi" : "нет связи",
                   ip, ssid.c_str(),
                   w ? (int) wifi::global_wifi_component->wifi_rssi() : 0,
                   get_mac_address_pretty().c_str(),
                   api::global_api_server->is_connected()
                     ? (api::global_api_server->is_connected_with_state_subscription()
                          ? "подключён, данные идут" : "подключён, данные ещё не идут")
                     : "нет связи");
          lv_label_set_text(id(lbl_netinfo), buf);
          lv_label_set_text(id(lbl_net_wifi), w ? ssid.c_str() : "не подключено");
          lv_label_set_text(id(lbl_net_eth), "кабель не подключён");

          // Подсказка с адресом веб-интерфейса на странице сети.
          char wb[64] = "нет сети";
          if (w) {
            char ipb[48];
            ips[0].str_to(ipb);
            snprintf(wb, sizeof(wb), "http://%s:8080", ipb);
          }
          lv_label_set_text(id(lbl_web_addr), wb);

  # Досинхронизация времени.
  #
  # ESPHome поднимает SNTP в setup(), то есть ДО появления сети: первая
  # попытка уходит в пустоту, а следующая — только через интервал
  # синхронизации, то есть через часы. Поэтому пока время не получено,
  # перезапускаем SNTP каждые 20 с при живой сети.
  - interval: 20s
    then:
      - lambda: |-
          if (id(sntp_time).now().is_valid()) return;
          if (!wifi::global_wifi_component->is_connected()) return;
          // Частая причина — не работает разрешение имён: сервер задан
          // именем, а DNS в сети не выдан или недоступен.
          auto dns = wifi::global_wifi_component->get_dns_address(0);
          char dbuf[48] = "нет";
          dns.str_to(dbuf);

          ESP_LOGI("time", "времени нет — перезапускаю SNTP (DNS: %s)", dbuf);
          id(sntp_time).call_setup();
          id(sntp_time).update();

  # Постоянный присмотр за DNS.
  #
  # Сервер имён на панели то и дело оказывается нулевым при исправно
  # полученном адресе — похоже, Ethernet без кабеля бесконечно долбится
  # в DHCP и затирает общие настройки. Без DNS не работает ни синхронизация
  # времени, ни обращение к Home Assistant по имени.
  #
  # Раньше эта проверка жила внутри цикла досинхронизации времени и потому
  # замолкала, как только время получено. Теперь смотрим всегда.
  - interval: 5s
    then:
      - lambda: |-
          if (!wifi::global_wifi_component->is_connected()) return;
          const ip_addr_t *cur = dns_getserver(0);
          const bool empty = (cur == nullptr) || ip_addr_isany(cur);
          if (!empty) return;
          ip_addr_t fb;
          IP_ADDR4(&fb, 1, 1, 1, 1);
          dns_setserver(0, &fb);
          IP_ADDR4(&fb, 8, 8, 8, 8);
          dns_setserver(1, &fb);
          // Молча: при живом Ethernet без кабеля это срабатывает постоянно,
          // и лог превратился бы в поток одинаковых строк.
          static uint32_t reported = 0;
          if (millis() - reported > 60000) {
            reported = millis();
            ESP_LOGW("net", "сервер имён затирается (вероятно, Ethernet без кабеля) — держу резервный 1.1.1.1");
          }

  # Применение настроек, пришедших из веб-интерфейса.
  #
  # Сохранённые настройки сами по себе только лежат в файле. Раньше тему
  # переключали кнопки на панели, а после их удаления применять изменения
  # стало некому — правка в браузере сохранялась, но ничего не меняла.
  # Теперь следим за ревизией: она растёт при каждой записи.
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t seen = 0;
          const uint32_t rev = id(panel_storage)->settings_revision();
          if (rev == seen) return;
          seen = rev;
          ESP_LOGI("settings", "настройки изменились — применяю");

          // Тема: и оформление интерфейса, и цвета карточек.
          if (id(panel_storage)->theme() == "light") id(theme_light).execute();
          else                                      id(theme_dark).execute();
          id(panel_storage)->rebuild();

          // Яркость применится сама следующим тиком присмотра за экраном,
          // но лучше не заставлять человека ждать секунду после движения
          // ползунка в браузере.
          auto call = id(backlight).turn_on();
          call.set_brightness(id(panel_storage)->brightness() / 100.0f);
          call.perform();

  # Обновление кадров с камер.
  #
  # Раз в полминуты, а не потоком: панель показывает снимок, а не видео.
  #
  # ВНИМАНИЕ. Замерено на живой панели: кадр 960x1280 весом 192 КБ грузится
  # и раскодируется около 5 секунд, и всё это время главный цикл занят —
  # панель не реагирует на касания. Отсюда редкий интервал.
  #
  # Чем это лечится по-настоящему:
  #   - отдавать с Home Assistant кадр поменьше (у камеры обычно есть
  #     второй поток низкого разрешения — его и надо показывать);
  #   - декодировать аппаратным блоком JPEG у P4. ESPHome его не использует,
  #     а свой декодер — отдельная работа.
  - interval: 30s
    then:
      - lambda: |-
          if (!api::global_api_server->is_connected() &&
              !wifi::global_wifi_component->is_connected()) return;
          id(panel_storage)->refresh_cameras();

  # Пересчёт шаблонов.
  #
  # Раз в полминуты: значения меняются не мгновенно, а каждый запрос —
  # это TLS-рукопожатие с Home Assistant. Сам запрос уходит в отдельную
  # задачу и главный цикл не держит.
  - interval: 30s
    then:
      - lambda: 'id(panel_storage)->refresh_templates();'

  # Применение настроек Ethernet.
  #
  # Интерфейс поднимается только когда его включили в веб-интерфейсе.
  # Пока он выключен, DHCP не работает и общие настройки имён не портит —
  # это и есть настоящее лечение истории с пропадающим DNS.
  - interval: 3s
    then:
      - lambda: |-
          auto *ps = id(panel_storage);
          static int applied = -1;                 // -1 ещё не применяли
          const int want = ps->eth_enabled() ? 1 : 0;
          if (want == applied) return;
          applied = want;

          if (!want) {
            id(eth).disable();
            ESP_LOGI("net", "Ethernet выключен по настройке");
            return;
          }

          id(eth).enable();

          if (!ps->eth_static() || ps->eth_ip().empty()) {
            ESP_LOGI("net", "Ethernet включён, адрес по DHCP");
            return;
          }

          // Статический адрес задаём через esp_netif: set_manual_ip
          // у компонента ESPHome защищённый, а интерфейс находится
          // по стандартному ключу ETH_DEF. Применяем с задержкой —
          // к этому моменту netif уже поднят.
          id(panel_storage)->set_timeout(1500, []() {
            auto *ps2 = id(panel_storage);
            esp_netif_t *nif = esp_netif_get_handle_from_ifkey("ETH_DEF");
            if (nif == nullptr) {
              ESP_LOGW("net", "Ethernet: интерфейс не найден, статический адрес не задан");
              return;
            }
            esp_netif_dhcpc_stop(nif);
            esp_netif_ip_info_t ip = {};
            ip.ip.addr = esp_ip4addr_aton(ps2->eth_ip().c_str());
            ip.netmask.addr = esp_ip4addr_aton(ps2->eth_mask().c_str());
            ip.gw.addr = esp_ip4addr_aton(ps2->eth_gw().c_str());
            if (esp_netif_set_ip_info(nif, &ip) != ESP_OK) {
              ESP_LOGW("net", "Ethernet: адрес %s не принят", ps2->eth_ip().c_str());
              return;
            }
            if (!ps2->eth_dns().empty()) {
              esp_netif_dns_info_t d = {};
              d.ip.type = ESP_IPADDR_TYPE_V4;
              d.ip.u_addr.ip4.addr = esp_ip4addr_aton(ps2->eth_dns().c_str());
              esp_netif_set_dns_info(nif, ESP_NETIF_DNS_MAIN, &d);
            }
            ESP_LOGI("net", "Ethernet: статический адрес %s", ps2->eth_ip().c_str());
          });
