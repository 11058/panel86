# ---------------------------------------------------------------------------
# Профиль сети: Ethernet (рекомендуемый основной канал).
# Пины IP101 из рабочего конфига chrisdunnname; на плате не проверены.
#
# Почему это профиль по умолчанию: у связки P4+C6 по SDIO в ESPHome есть
# открытая проблема со срывами ассоциации (esphome/esphome#10956).
# Ethernet её обходит целиком. См. docs/adr/0003-set.md
# ---------------------------------------------------------------------------

ethernet:
  id: eth
  # По умолчанию интерфейс НЕ поднимается. Причина не в экономии: Ethernet
  # без кабеля повторяет DHCP каждые 15 секунд и каждый раз затирает общие
  # настройки сервера имён — из-за этого не синхронизировалось время
  # и не открывался Home Assistant. Включается из веб-интерфейса,
  # когда кабель действительно воткнут.
  enable_on_boot: false
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO51
