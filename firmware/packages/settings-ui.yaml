# ---------------------------------------------------------------------------
# Настройки на панели — только сеть.
#
# Всё остальное (яркость, засыпание, расписание, тема, время, сведения)
# настраивается в веб-интерфейсе. Причина простая: настенная панель плохо
# приспособлена для форм. Пальцем по ползункам и спискам на 720x720
# промахиваешься, содержимое не помещается, а каждая новая настройка
# требует ещё одной страницы и ещё одной борьбы с оформлением LVGL.
#
# На панели остаётся ровно то, без чего к ней нельзя подключиться,
# то есть то, что нельзя настроить удалённо: Wi-Fi и Ethernet.
# ---------------------------------------------------------------------------

lvgl:
  pages:
    # --- Сеть: меню ---
    - id: page_settings
      widgets:
        - label:
            text: "Сеть"
            align: TOP_MID
            y: 64
            text_font: f_title
        - button:
            align: TOP_LEFT
            x: 20
            y: 58
            width: 130
            height: 50
            widgets:
              - label: { text: "Назад", align: CENTER }
            on_click:
              - lvgl.page.show: page_layout

        - button:
            align: TOP_MID
            y: 140
            width: 620
            height: 92
            widgets:
              - label: { text: "Wi-Fi", align: LEFT_MID, x: 20, text_font: f_body }
              - label: { id: lbl_net_wifi, text: "—", align: RIGHT_MID, x: -20, text_font: f_small }
            on_click:
              - script.execute: style_extras
              - lvgl.page.show: page_wifi_list

        - button:
            align: TOP_MID
            y: 252
            width: 620
            height: 92
            widgets:
              - label: { text: "Ethernet", align: LEFT_MID, x: 20, text_font: f_body }
              - label: { id: lbl_net_eth, text: "—", align: RIGHT_MID, x: -20, text_font: f_small }
            on_click:
              - script.execute: style_extras
              - lvgl.page.show: page_netstat

        - button:
            align: TOP_MID
            y: 364
            width: 620
            height: 92
            widgets:
              - label: { text: "Состояние", align: LEFT_MID, x: 20, text_font: f_body }
              - label: { text: "текущие параметры", align: RIGHT_MID, x: -20, text_font: f_small }
            on_click:
              - script.execute: style_extras
              - lvgl.page.show: page_netstat

        # Подсказка, где искать всё остальное. Без неё человек будет
        # искать яркость на панели и не найдёт.
        - label:
            id: lbl_web_hint
            text: "Остальные настройки — в браузере"
            align: BOTTOM_MID
            y: -70
            text_font: f_small
        - label:
            id: lbl_web_addr
            text: "—"
            align: BOTTOM_MID
            y: -36
            text_font: f_body

    # --- Состояние сети ---
    - id: page_netstat
      widgets:
        - label:
            text: "Состояние сети"
            align: TOP_MID
            y: 64
            text_font: f_title
        - button:
            align: TOP_LEFT
            x: 20
            y: 58
            width: 130
            height: 50
            widgets:
              - label: { text: "Назад", align: CENTER }
            on_click:
              - lvgl.page.show: page_settings
        - label:
            id: lbl_netinfo
            text: "—"
            align: TOP_LEFT
            x: 40
            y: 130
            text_font: f_small
