# ===========================================================================
# P0 — «Живое железо и цифры».
#
# Цель фазы НЕ красивый интерфейс, а измерения: сколько кадров тянет LVGL на
# 720x720, сколько остаётся памяти, сколько держится время цикла и насколько
# плата греется в закрытом подрозетнике. Эти числа — опорная точка на весь
# проект. Никакого своего кода здесь нет и быть не должно.
#
# ВНИМАНИЕ: конфиг ещё ни разу не компилировался. Первое, что делать:
#     esphome config firmware/panel86-p0.yaml
# и чинить то, что вылезет. См. docs/01-p0-bringup.md
# ===========================================================================

substitutions:
  name: panel86-p0
  friendly_name: "Панель 86 · P0"

esphome:
  name: ${name}
  # dns_setserver нужен для резервного DNS, когда сеть его не выдала
  includes:
    - lwip_dns_shim.h
    - editor_html.h
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  on_boot:
    - priority: -100
      then:
        - logger.log: "P0 загрузился"
        # Стартовая страница выбирается по наличию настроек сети.
        #
        # has_sta() истинно, если сеть задана хоть откуда-то: зашита
        # в прошивке или загружена из NVS при старте. Ложно — значит
        # панель включили впервые и настраивать нечем, показываем настройку.
        #
        # Задавать страницу явно нужно ещё и потому, что страницы из пакетов
        # попадают в список раньше страниц основного конфига, и без этого
        # стартовой оказывается page_wifi_list. Опции «начальная страница»
        # в ESPHome нет.
        # Контейнер для интерпретатора: задаём один раз при загрузке,
        # чтобы заливка раскладки по HTTP сразу перестраивала экран.
        # ЗАСЕВКА РАСКЛАДКИ ДЛЯ РАЗРАБОТКИ.
        # Нужна, пока у панели нет сети: залить раскладку по HTTP или
        # кнопкой из Home Assistant нечем. Убрать, как только появится сеть.
        - lambda: |-
            id(panel_storage)->write_layout("{\"schema\": \"panel86/1\", \"room\": \"gostinaia\", \"revision\": 3, \"theme\": {\"accent\": \"#C2610C\", \"radius\": 20}, \"defaults\": {\"throttle\": \"1s\", \"deadband\": 0.5}, \"pages\": [{\"id\": \"home\", \"title\": \"Гостиная\", \"grid\": [2, 3], \"cards\": [{\"type\": \"light\", \"entity\": \"light.esp8266sw1_relay_1\", \"label\": \"Люстра\"}, {\"type\": \"light\", \"entity\": \"light.esp8266sw1_relay_2\", \"label\": \"Бра\"}, {\"type\": \"climate\", \"entity\": \"climate.iug_lugovaia_12_gostinaia_2\", \"label\": \"Отопление\", \"unit\": \"°C\"}, {\"type\": \"sensor\", \"entity\": \"sensor.iug_lugovaia_12_gostinaia_2\", \"label\": \"Температура\", \"unit\": \"°C\", \"decimals\": 1}, {\"type\": \"switch\", \"entity\": \"switch.esp32ac2_esp32ac2_dry\", \"label\": \"Осушение\"}, {\"type\": \"sensor\", \"entity\": \"sensor.kca16homemcu1_smoke_ch1_status\", \"label\": \"Дым\", \"decimals\": 0}]}, {\"id\": \"ogorod\", \"title\": \"Огород\", \"grid\": [2, 2], \"cards\": [{\"type\": \"switch\", \"entity\": \"switch.kca6watertower_pumpmotor\", \"label\": \"Насос\"}, {\"type\": \"valve\", \"entity\": \"valve.kca6frontyard_splinkler\", \"label\": \"Газон\"}, {\"type\": \"sensor\", \"entity\": \"sensor.kca6watertower_tanklevel\", \"label\": \"Уровень бака\", \"unit\": \"%\", \"decimals\": 0, \"warn_below\": 15}, {\"type\": \"sensor\", \"entity\": \"sensor.kca6watertower_pzem_voltage\", \"label\": \"Напряжение\", \"unit\": \"В\", \"decimals\": 0, \"deadband\": 1.0, \"throttle\": \"2s\", \"warn_below\": 200}]}, {\"id\": \"bania\", \"title\": \"Баня\", \"grid\": [2, 2], \"cards\": [{\"type\": \"light\", \"entity\": \"light.bania\", \"label\": \"Свет\"}, {\"type\": \"light\", \"entity\": \"light.kca6banya_backlight_banya\", \"label\": \"Подсветка\"}, {\"type\": \"switch\", \"entity\": \"switch.kca6banya_heatingwaterwire\", \"label\": \"Нагрев воды\"}, {\"type\": \"sensor\", \"entity\": \"sensor.kca6frontyard_currentload\", \"label\": \"Нагрузка\", \"unit\": \"Вт\", \"decimals\": 0}]}], \"screensaver\": {\"after\": \"60s\", \"type\": \"clock\", \"brightness\": 12, \"wake\": [\"touch\"]}}");
        - script.execute: hoist_overlays
        - script.execute: style_extras
        - if:
            condition:
              lambda: 'return id(panel_storage)->theme() == "light";'
            then:
              - script.execute: theme_light
        - lambda: |-
            id(panel_storage)->set_root(id(ui_root));
            id(panel_storage)->set_fonts(id(f_title)->get_lv_font(),
                                         id(f_body)->get_lv_font(),
                                         id(f_small)->get_lv_font());
        - if:
            condition:
              lambda: 'return wifi::global_wifi_component->has_sta();'
            then:
              # Сеть настроена: если раскладка есть — показываем её,
              # если нет — служебный экран P0.
              - if:
                  condition:
                    lambda: 'return id(panel_storage)->rebuild();'
                  then:
                    - logger.log: "Раскладка построена, показываю её"
                    - lvgl.page.show: page_layout
                    # Если Home Assistant не подключился за 15 с, показываем
                    # правдоподобные значения. Иначе панель без сервера —
                    # это сетка прочерков, по которой ничего не проверить.
                    - delay: 15s
                    - if:
                        condition:
                          lambda: 'return !api::global_api_server->is_connected();'
                        then:
                          - logger.log: "HA не подключился — включаю демо-режим"
                          - lambda: 'id(panel_storage)->demo_fill();'
                  else:
                    - lvgl.page.show: page_p0
            else:
              - logger.log: "Сеть не настроена — открываю настройку Wi-Fi"
              - lvgl.page.show: page_wifi_list
              - script.execute: wifi_scan_start

# Своя таблица разделов: штатная не оставляет места под файловую систему.
# Прошивать ТОЛЬКО по USB — смена таблицы по OTA не проходит.
esp32:
  partitions: partitions.csv

# Свой компонент: хранилище раскладки. Начало P3.
external_components:
  - source:
      type: local
      path: ../components
    components: [ panel_ui ]

panel_ui:
  id: panel_storage
  partition: storage

packages:
  board: !include packages/board.yaml
  eth:   !include packages/net-ethernet.yaml
  # Без зашитых учётных данных: сеть берётся только из NVS,
  # то есть из того, что ввели на экране панели.
  wifi:  !include packages/net-wifi-provision.yaml
  wifiui: !include packages/wifi-setup-ui.yaml
  spike: !include packages/spike-runtime-binding.yaml
  layout: !include packages/layout-page.yaml
  statusbar: !include packages/statusbar.yaml
  settings: !include packages/settings-ui.yaml
  lvtheme: !include packages/lvgl-theme.yaml
  theme: !include packages/theme-fix.yaml

# Оба канала одновременно. Первый в списке — приоритетный: именно он
# держит маршрут по умолчанию, второй остаётся горячим резервом.
# Без этого блока ESPHome не даёт объявить wifi и ethernet вместе.
network:
  priority:
    - wifi
    - ethernet

logger:
  hardware_uart: UART0
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

# --------------------------------------------------------------------------
# Приборы. Ради этого вся фаза и существует.
# --------------------------------------------------------------------------
debug:
  update_interval: 10s

sensor:
  - platform: debug
    free:
      name: "Свободная куча"
      entity_category: diagnostic
    loop_time:
      name: "Время цикла"
      entity_category: diagnostic
    psram:
      name: "Свободный PSRAM"
      entity_category: diagnostic

  - platform: internal_temperature
    name: "Температура SoC"
    entity_category: diagnostic
    update_interval: 30s

  - platform: uptime
    name: "Время работы"
    entity_category: diagnostic

  - platform: template
    id: bench_fps
    name: "Бенчмарк, кадров в секунду"
    unit_of_measurement: "fps"
    accuracy_decimals: 1
    entity_category: diagnostic

text_sensor:
  - platform: debug
    device:
      name: "Устройство"
    reset_reason:
      name: "Причина перезагрузки"

globals:
  - id: t_bench
    type: uint32_t
    restore_value: false
    initial_value: "0"

# --------------------------------------------------------------------------
# Бенчмарк отрисовки.
# Гоняем N полных перерисовок экрана, делим на затраченное время.
# Число грубое, но сравнимое между настройками — а нужно именно сравнение:
# 16 бит против 24, с ускорением PPA и без, при разной доле буфера.
# --------------------------------------------------------------------------
script:
  - id: bench_redraw
    mode: single
    then:
      - logger.log: "БЕНЧМАРК: старт"
      - lambda: 'id(t_bench) = millis();'
      - repeat:
          count: 120
          then:
            - lvgl.widget.redraw:
            - delay: 1ms
      - lambda: |-
          uint32_t dt = millis() - id(t_bench);
          float fps = dt ? 120000.0f / (float) dt : 0.0f;
          ESP_LOGI("bench", "120 перерисовок за %u мс -> %.1f к/с", dt, fps);
          id(bench_fps).publish_state(fps);

button:
  - platform: template
    name: "Запустить бенчмарк"
    entity_category: diagnostic
    on_press:
      - script.execute: bench_redraw

# --------------------------------------------------------------------------
# Шрифты.
#
# Встроенные montserrat_* содержат только латиницу — весь русский текст
# на экране превращается в квадратики. Найдено на живой плате.
# Кириллицу даёт glyphsets: GF_Cyrillic_Core (241 глиф) + GF_Latin_Core.
# --------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto@500"
    id: f_title
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto@400"
    id: f_body
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]
  - file: "gfonts://Roboto@400"
    id: f_small
    size: 17
    bpp: 4
    glyphsets: [GF_Latin_Core, GF_Cyrillic_Core]

# --------------------------------------------------------------------------
# Минимальный интерфейс: показать, что экран и тач живые, и дать чем нагрузить.
# --------------------------------------------------------------------------
lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 25%
  default_font: f_body      # иначе кнопки унаследуют латинский шрифт LVGL
  pages:
    - id: page_p0
      widgets:
        - label:
            id: lbl_title
            text: "P0 · живое железо"
            align: TOP_MID
            y: 24
            text_font: f_title
        - label:
            id: lbl_touch
            text: "коснитесь экрана"
            align: CENTER
            y: -60
            text_font: f_body
        - button:
            id: btn_bench
            align: CENTER
            y: 20
            width: 320
            height: 80
            widgets:
              - label:
                  text: "Бенчмарк"
                  align: CENTER
            on_click:
              - script.execute: bench_redraw
        - button:
            id: btn_relay
            align: CENTER
            y: 130
            width: 320
            height: 80
            widgets:
              - label:
                  text: "Реле 1"
                  align: CENTER
            on_click:
              # Локальный фолбэк: реле щёлкает прямо здесь, без участия HA.
              # Это надо проверить в P0, выдернув сетевой кабель.
              - switch.toggle: relay_1
        - button:
            id: btn_wifi_setup
            align: BOTTOM_MID
            y: -70
            width: 320
            height: 60
            widgets:
              - label:
                  text: "Настройка Wi-Fi"
                  align: CENTER
            on_click:
              - lvgl.page.show: page_wifi_list
        - label:
            id: lbl_stat
            align: BOTTOM_MID
            y: -24
            text: "—"
            text_font: f_small

interval:
  - interval: 2s
    then:
      - lvgl.label.update:
          id: lbl_stat
          text: !lambda |-
            char buf[96];
            snprintf(buf, sizeof(buf), "куча %u КиБ · psram %u КиБ",
                     (unsigned)(esp_get_free_heap_size() / 1024),
                     (unsigned)(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
            return {buf};
